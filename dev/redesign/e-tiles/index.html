<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Magnolia Proxy - Live Tiles</title>
<script>
/* set theme before first paint */
(function () {
  var t = null;
  try { t = localStorage.getItem('mp-e-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
:root {
  --c-light: #f59e0b; --c-switch: #3b82f6; --c-fan: #14b8a6; --c-sensor: #8b5cf6; --c-energy: #22c55e;
  --i-light: #a15207; --i-switch: #1d4ed8; --i-fan: #0f766e; --i-sensor: #6d28d9; --i-energy: #15803d;
  --p: var(--primary-color, #4f46e5);
  --on-p: #ffffff;
  --txt: var(--primary-text-color, #12151c);
  --txt2: var(--secondary-text-color, #475063);
  --bg: var(--primary-background-color, #eef0f8);
  --card: var(--card-background-color, #ffffff);
  --line: var(--divider-color, rgba(18, 21, 28, .16));
  --glass: rgba(255, 255, 255, .68);
  --glass-strong: rgba(255, 255, 255, .86);
  --glass-line: rgba(255, 255, 255, .9);
  --field: rgba(255, 255, 255, .9);
  --shadow: 0 1px 2px rgba(30, 30, 80, .06), 0 8px 24px rgba(40, 40, 110, .09);
  --danger: #b91c1c; --danger-bg: #fee2e2;
  --warn: #8a3b0a; --warn-bg: #fef0c7;
  --ok: #166534; --ok-bg: #dcfce7;
  --aurora1: rgba(139, 92, 246, .22); --aurora2: rgba(245, 158, 11, .20); --aurora3: rgba(20, 184, 166, .20);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
:root[data-theme="dark"] {
  --primary-color: #a5a8ff; --on-p: #0d0e1c;
  --primary-text-color: #eef0f7; --secondary-text-color: #b2b8c8;
  --primary-background-color: #0b0d14; --card-background-color: #171a25;
  --divider-color: rgba(255, 255, 255, .16);
  --i-light: #fbbf24; --i-switch: #7db4ff; --i-fan: #2dd4bf; --i-sensor: #b9a2ff; --i-energy: #4ade80;
  --glass: rgba(30, 34, 50, .62); --glass-strong: rgba(26, 29, 44, .88); --glass-line: rgba(255, 255, 255, .09);
  --field: rgba(10, 12, 20, .55);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .35);
  --danger: #fca5a5; --danger-bg: rgba(239, 68, 68, .18);
  --warn: #fcd34d; --warn-bg: rgba(245, 158, 11, .18);
  --ok: #86efac; --ok-bg: rgba(34, 197, 94, .16);
  --aurora1: rgba(139, 92, 246, .22); --aurora2: rgba(245, 158, 11, .10); --aurora3: rgba(20, 184, 166, .14);
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100dvh; color: var(--txt); background: var(--bg);
  font: 400 16px/1.4 ui-rounded, "SF Pro Rounded", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  overflow-x: hidden; position: relative;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(60% 40% at 8% 0%, var(--aurora1), transparent 70%),
    radial-gradient(50% 40% at 100% 20%, var(--aurora2), transparent 70%),
    radial-gradient(60% 50% at 30% 100%, var(--aurora3), transparent 70%);
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
h1, h2, h3, p { margin: 0; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--p); outline-offset: 2px; border-radius: 8px; }
.ic { display: inline-flex; width: 1.25em; height: 1.25em; flex: none; }
.ic svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.mono { font-family: ui-monospace, "SF Mono", Consolas, Menlo, monospace; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* domain colour coding */
.k-light { --acc: var(--c-light); --ink: var(--i-light); }
.k-switch { --acc: var(--c-switch); --ink: var(--i-switch); }
.k-fan { --acc: var(--c-fan); --ink: var(--i-fan); }
.k-sensor { --acc: var(--c-sensor); --ink: var(--i-sensor); }
.k-energy { --acc: var(--c-energy); --ink: var(--i-energy); }

/* simulator bar */
.sim {
  position: relative; z-index: 5; font-size: 12px; color: var(--txt2);
  background: color-mix(in srgb, var(--txt) 7%, transparent);
  border-bottom: 1px dashed var(--line); padding: var(--safe-t) max(12px, var(--safe-r)) 0 max(12px, var(--safe-l));
}
.sim-row { display: flex; align-items: center; gap: 8px; min-height: 44px; }
.sim-toggle { min-height: 44px; padding: 0 10px; background: none; border: 0; display: inline-flex; align-items: center; gap: 6px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 11px; color: var(--txt); }
.sim-toggle .ic { transition: transform .2s; }
.sim-toggle[aria-expanded="true"] .ic { transform: rotate(180deg); }
.sim-log { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-family: ui-monospace, Consolas, monospace; font-size: 11px; }
.sim a.back { color: var(--txt); min-height: 44px; display: inline-flex; align-items: center; padding: 0 6px; font-weight: 600; }
.sim-body { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px 0 10px; }
.sim-body button { min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass-strong); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.sim-body button[aria-pressed="true"] { background: var(--danger-bg); color: var(--danger); border-color: var(--danger); }

/* top header */
.top { padding: 18px max(16px, var(--safe-r)) 6px max(16px, var(--safe-l)); max-width: 1400px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.logo { width: 46px; height: 46px; border-radius: 16px; flex: none; display: grid; place-items: center; color: #fff;
  background: conic-gradient(from 210deg, #8b5cf6, #f59e0b, #14b8a6, #22c55e, #8b5cf6); box-shadow: var(--shadow); }
.logo svg { width: 26px; height: 26px; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
.brand h1 { font-size: 1.35rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.brand p { color: var(--txt2); font-size: .85rem; }
.live { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: .8rem; color: var(--txt2); padding: 6px 12px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-line); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c-energy); box-shadow: 0 0 0 0 var(--c-energy); animation: pulse 2.4s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34,197,94,.55); } 70%,100% { box-shadow: 0 0 0 8px rgba(34,197,94,0); } }
@media (max-width: 420px) { .live .lbl { display: none; } }

main { max-width: 1400px; margin: 0 auto; padding: 8px max(16px, var(--safe-r)) calc(110px + var(--safe-b)) max(16px, var(--safe-l)); }
.banner { display: flex; align-items: flex-start; gap: 10px; margin: 8px 0 4px; padding: 12px 8px 12px 14px; border-radius: 18px; background: var(--danger-bg); color: var(--danger); border: 1px solid currentColor; font-weight: 600; }
.banner p { flex: 1; padding-top: 10px; }
.banner button { min-width: 44px; min-height: 44px; border: 0; background: none; color: inherit; border-radius: 12px; display: grid; place-items: center; }

/* groups + grid */
.group { margin-top: 22px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.grid.list { grid-template-columns: 1fr; max-width: 820px; gap: 8px; margin-inline: auto; }
.group > .grid > .full { grid-column: 1 / -1; }
.tile, .card {
  position: relative; background: var(--glass); border: 1px solid var(--glass-line); border-radius: 26px;
  box-shadow: var(--shadow); -webkit-backdrop-filter: blur(16px) saturate(150%); backdrop-filter: blur(16px) saturate(150%);
}
.tile { padding: 16px; overflow: hidden; display: grid; gap: 10px 12px; min-width: 0;
  grid-template-columns: auto 1fr; grid-template-areas: "badge name" "val val" "extra extra" "src src";
  transition: transform .16s cubic-bezier(.3,1.4,.5,1), box-shadow .2s, background .4s; }
.tile::before { content: ""; position: absolute; width: 60%; aspect-ratio: 1; right: -18%; top: -34%; border-radius: 50%;
  background: var(--acc); opacity: .16; filter: blur(34px); pointer-events: none; transition: opacity .5s; }
.tile[data-on="true"]::before { opacity: .55; }
.tile:active { transform: scale(.965); }
@media (hover: hover) { .tile:hover { box-shadow: 0 2px 4px rgba(30,30,80,.08), 0 14px 34px rgba(40,40,110,.16); } }
.badge { grid-area: badge; width: 48px; height: 48px; border-radius: 17px; display: grid; place-items: center; font-size: 1.35rem;
  color: var(--ink); background: color-mix(in srgb, var(--acc) 20%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--acc) 30%, transparent); }
.tile[data-on="true"] .badge { background: var(--acc); color: #fff; box-shadow: 0 6px 18px color-mix(in srgb, var(--acc) 55%, transparent); }
.k-light[data-on="true"] .badge { color: #3b2400; }
.tile[data-on="true"].k-fan .badge .ic { animation: spin 1.1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.t-name { grid-area: name; min-width: 0; align-self: center; }
.tile-open { position: static; background: none; border: 0; padding: 0; text-align: left; font-weight: 700; font-size: 1.05rem; line-height: 1.2; display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 24px; }
.tile-open::after { content: ""; position: absolute; inset: 0; z-index: 1; border-radius: inherit; }
.tile-open:focus-visible { outline: none; }
.tile:has(.tile-open:focus-visible) { outline: 3px solid var(--p); outline-offset: 2px; }
.t-kind { display: block; font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--txt2); font-weight: 600; }
.t-val { grid-area: val; display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; min-width: 0; }
.big { font-size: clamp(2.3rem, 11vw, 3.1rem); font-weight: 800; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
.unit { font-size: 1.1rem; font-weight: 600; color: var(--txt2); margin-left: 4px; letter-spacing: 0; }
.t-extra { grid-area: extra; display: grid; gap: 4px; }
.spark { width: 100%; height: 38px; display: block; overflow: visible; }
.spark .ln { fill: none; stroke: var(--ink); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
.spark .ar { fill: var(--acc); opacity: .22; }
.delta { font-size: .8rem; font-weight: 700; color: var(--ok); font-variant-numeric: tabular-nums; }
.t-src { grid-area: src; font-size: .75rem; color: var(--txt2); overflow-wrap: anywhere; z-index: 0; }
/* switch */
.sw { position: relative; z-index: 2; width: 64px; min-height: 48px; background: none; border: 0; padding: 0; display: grid; place-items: center; flex: none; }
.sw .trk { width: 56px; height: 32px; border-radius: 99px; background: color-mix(in srgb, var(--txt) 22%, transparent); position: relative; transition: background .25s; }
.sw .trk::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35); transition: transform .28s cubic-bezier(.3,1.5,.5,1); }
.sw[aria-checked="true"] .trk { background: var(--acc); }
.sw[aria-checked="true"] .trk::after { transform: translateX(24px); }
.sw:active .trk::after { width: 32px; }
.sw[aria-checked="true"]:active .trk::after { transform: translateX(18px); }
/* list rows */
.tile.row { grid-template-columns: auto 1fr auto; grid-template-areas: "badge name val" "badge src val"; padding: 10px 14px 10px 12px; border-radius: 22px; align-items: center; gap: 0 12px; min-height: 72px; }
.tile.row .badge { width: 44px; height: 44px; border-radius: 15px; }
.tile.row .t-extra, .tile.row .t-kind { display: none; }
.tile.row .big { font-size: 1.4rem; }
.tile.row .unit { font-size: .85rem; }
.tile.row .t-val { align-items: center; }
.tile.row::before { display: none; }
.tile.row .t-src { align-self: start; }
/* device header tile */
.dev { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 14px 14px 16px; border-radius: 28px;
  background: linear-gradient(120deg, color-mix(in srgb, var(--p) 22%, var(--glass)), var(--glass) 70%); }
.dev .badge { background: var(--p); color: var(--on-p); box-shadow: 0 6px 18px color-mix(in srgb, var(--p) 45%, transparent); width: 56px; height: 56px; border-radius: 20px; font-size: 1.6rem; }
.dev .info { flex: 1 1 160px; min-width: 0; }
.dev h2 { font-size: 1.3rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; overflow-wrap: anywhere; }
.dev .sub { color: var(--txt2); font-size: .88rem; }
.dev .acts { display: flex; gap: 8px; flex: 1 1 100%; }
@media (min-width: 560px) { .dev .acts { flex: none; } }
.dev .acts .btn.primary { flex: 1; }
/* add tiles */
.add { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 96px; width: 100%; border: 2px dashed var(--line); background: transparent; border-radius: 26px; color: var(--txt2); font-weight: 700; padding: 12px; -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: none; transition: transform .16s, border-color .2s, color .2s, background .2s; }
.add .ic { font-size: 1.7rem; color: var(--p); }
.add small { font-weight: 500; font-size: .8rem; }
.add:hover { border-color: var(--p); color: var(--txt); background: color-mix(in srgb, var(--p) 8%, transparent); }
.add:active { transform: scale(.97); }
.add.bigadd { min-height: 120px; margin-top: 26px; }
/* buttons */
.btn { min-height: 48px; padding: 0 18px; border-radius: 16px; border: 1px solid var(--line); background: var(--glass-strong); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .12s, opacity .2s; }
.btn:active { transform: scale(.96); }
.btn.primary { background: var(--p); color: var(--on-p); border-color: transparent; box-shadow: 0 6px 16px color-mix(in srgb, var(--p) 40%, transparent); }
.btn.danger { color: var(--danger); border-color: currentColor; background: var(--danger-bg); }
.btn.solid-danger { background: #b91c1c; color: #fff; border-color: transparent; }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.btn.icon { width: 48px; padding: 0; }
/* dock */
.dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + var(--safe-b)); z-index: 20; display: flex; gap: 4px; padding: 6px; border-radius: 999px; max-width: calc(100vw - 16px);
  background: var(--glass-strong); border: 1px solid var(--glass-line); box-shadow: 0 10px 40px rgba(20, 20, 60, .28); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
.dock button { min-height: 48px; min-width: 48px; padding: 0 14px; border-radius: 999px; border: 0; background: none; font-weight: 700; font-size: .92rem; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: background .2s, transform .12s; }
.dock button:active { transform: scale(.94); }
.dock button[aria-pressed="true"] { background: var(--p); color: var(--on-p); }
.dock .sep { width: 1px; background: var(--line); margin: 8px 2px; }
.dock .addbtn { color: var(--ink0, var(--p)); }
@media (max-width: 380px) { .dock button { padding: 0 11px; font-size: .85rem; } }
/* toast */
.toast { position: fixed; left: 50%; bottom: calc(86px + var(--safe-b)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 60; background: var(--txt); color: var(--bg); padding: 12px 18px; border-radius: 16px; font-weight: 600; max-width: calc(100vw - 32px); box-shadow: 0 10px 30px rgba(0,0,0,.3); transition: opacity .25s, transform .25s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
/* chips */
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 99px; font-size: .75rem; font-weight: 700; background: color-mix(in srgb, var(--txt) 9%, transparent); color: var(--txt); white-space: nowrap; }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--danger-bg); color: var(--danger); }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.fchips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.fchips button { min-height: 44px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--field); font-weight: 600; font-size: .85rem; text-transform: capitalize; }
.fchips button[aria-pressed="true"] { background: var(--p); color: var(--on-p); border-color: transparent; }
/* forms */
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label, .lbl-h { font-weight: 700; font-size: .9rem; }
.field input, .field select { min-height: 50px; padding: 0 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--field); font-size: 16px; width: 100%; }
.field input:focus-visible, .field select:focus-visible { outline: 3px solid color-mix(in srgb, var(--p) 55%, transparent); outline-offset: 0; border-color: var(--p); }
.hint { color: var(--txt2); font-size: .82rem; }
.step { display: flex; align-items: center; gap: 10px; margin: 18px 0 8px; }
.step .n { width: 26px; height: 26px; border-radius: 50%; background: var(--p); color: var(--on-p); display: grid; place-items: center; font-weight: 800; font-size: .8rem; flex: none; }
.step h3 { font-size: 1rem; font-weight: 800; }
.inline-err { color: var(--danger); background: var(--danger-bg); padding: 10px 14px; border-radius: 14px; font-weight: 600; margin: 10px 0; }
.wiz { grid-column: 1 / -1; padding: 18px; display: block; }
.wiz h2 { font-size: 1.2rem; font-weight: 800; letter-spacing: -.02em; }
.wiz .acts { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.wiz .acts .btn { flex: 1 1 130px; }
/* radio list */
.rlist { display: grid; gap: 8px; }
.rlist.scroll { max-height: 300px; overflow-y: auto; padding: 2px; overscroll-behavior: contain; }
.ritem { position: relative; }
.ritem input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
.ritem label { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 14px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--field); cursor: pointer; }
.ritem label .ic.b { width: 36px; height: 36px; padding: 8px; border-radius: 12px; color: var(--ink); background: color-mix(in srgb, var(--acc) 20%, transparent); }
.ritem .tx { flex: 1; min-width: 0; display: grid; }
.ritem .tt { font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
.ritem .ss { font-size: .78rem; color: var(--txt2); overflow-wrap: anywhere; }
.ritem .rt { font-size: .82rem; font-weight: 700; color: var(--txt2); text-align: right; font-variant-numeric: tabular-nums; }
.ritem label::after { content: ""; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex: none; transition: all .15s; }
.ritem input:checked + label { border-color: var(--p); background: color-mix(in srgb, var(--p) 11%, var(--field)); }
.ritem input:checked + label::after { border-color: var(--p); background: radial-gradient(circle, var(--p) 0 45%, transparent 50%); }
.ritem input:focus-visible + label { outline: 3px solid var(--p); outline-offset: 2px; }
.ritem input:disabled + label { opacity: .5; }
/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(8, 10, 24, .5); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); z-index: 40; opacity: 0; transition: opacity .25s; }
.scrim.open { opacity: 1; }
.sheet { position: fixed; z-index: 50; left: 0; right: 0; bottom: 0; max-height: 92dvh; display: flex; flex-direction: column; background: var(--card); color: var(--txt);
  border-radius: 28px 28px 0 0; box-shadow: 0 -10px 50px rgba(0,0,0,.35); transform: translateY(100%); transition: transform .32s cubic-bezier(.2,.9,.3,1); padding-left: var(--safe-l); padding-right: var(--safe-r); overflow: hidden; }
.sheet.open { transform: none; }
.sheet::before { content: ""; position: absolute; top: -50px; right: -40px; width: 200px; height: 200px; border-radius: 50%; background: var(--acc, var(--p)); opacity: .18; filter: blur(40px); pointer-events: none; }
.sheet .grab { width: 44px; height: 5px; border-radius: 9px; background: var(--line); margin: 10px auto 0; flex: none; }
.sh-head { display: flex; align-items: center; gap: 12px; padding: 10px 10px 8px 18px; position: relative; }
.sh-head .badge { width: 44px; height: 44px; border-radius: 15px; font-size: 1.2rem; flex: none; background: color-mix(in srgb, var(--acc, var(--p)) 20%, transparent); color: var(--ink, var(--p)); }
.sh-head .tx { flex: 1; min-width: 0; }
.sh-head h2 { font-size: 1.25rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; overflow-wrap: anywhere; }

    try {
      var r = await M.callApi('POST', 'magnolia_proxy/replace_apply', { mappings: mappings, energy_modes: modes });
      st.result = { applied: ch.length - (r.rejected || []).length, rejected: r.rejected || [] }; st.step = 'done'; refresh();
    } catch (e) { fail(e, err); }
    st.busy = false; draw();
  }
  openSheet({ title: 'Replace device', sub: dev.name, kind: 'switch', icon: 'swap', wide: true, body: body, footer: [] });
  draw();
}

/* ---------- simulator bar ---------- */
$('simToggle').addEventListener('click', function () {
  var b = $('simBody'), open = b.hidden;
  b.hidden = !open; $('simToggle').setAttribute('aria-expanded', String(open));
});
$('bTog').addEventListener('click', function () { M.toggleSource(); refresh(); });
$('bTick').addEventListener('click', function () { M.tickEnergy(); refresh(); });
$('bFail').addEventListener('click', function () { M.failNext(!M.isFailNext()); });
$('bReset').addEventListener('click', function () {
  M.reset(); S.hist = {}; S.base = {}; S.shown = {}; S.histCache = {}; S.wz = null; clearErr(); if (S.sheet) closeSheet(); S.data = null; S.loading = true; render(); refresh(); toast('Data reset');
});
function setTheme(t) { document.documentElement.setAttribute('data-theme', t); try { localStorage.setItem('mp-e-theme', t); } catch (e) {} }
$('bTheme').addEventListener('click', function () { setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); });

/* ---------- boot ---------- */
render();
refresh().then(function () {
  var q = location.hash.replace('#', '');
  if (q === 'demo-config') openConfig('prx_444444444444');
  else if (q === 'demo-replace') openReplace('vdev_0f9e8d7c6b5a');
  else if (q === 'demo-wizard') openProxyWizard('vdev_0f9e8d7c6b5a');
});
setInterval(function () { if (document.hidden || S.busy) return; M.tickEnergy(); refresh(); }, 10000);
})();
</script>
</body>
