<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Magnolia Proxy / Palette</title>
<meta name="color-scheme" content="light dark">
<style>
:root{
  --sans:"Helvetica Neue","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --tap:44px;--r:3px;
  --fb-bg:#f4f3ee;--fb-card:#ffffff;--fb-fg:#101010;--fb-muted:#585853;--fb-line:#d6d4cb;
  --fb-accent:#2a1ee0;--fb-ink:#ffffff;--fb-danger:#c0261b;--fb-tint:rgba(42,30,224,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --fb-bg:#0a0a0b;--fb-card:#131315;--fb-fg:#f1f1ec;--fb-muted:#9a9a94;--fb-line:#27272b;
    --fb-accent:#c8ff2e;--fb-ink:#0a0a0b;--fb-danger:#ff7468;--fb-tint:rgba(200,255,46,.09);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --fb-bg:#0a0a0b;--fb-card:#131315;--fb-fg:#f1f1ec;--fb-muted:#9a9a94;--fb-line:#27272b;
  --fb-accent:#c8ff2e;--fb-ink:#0a0a0b;--fb-danger:#ff7468;--fb-tint:rgba(200,255,46,.09);color-scheme:dark;
}
:root{
  --bg:var(--primary-background-color,var(--fb-bg));
  --card:var(--card-background-color,var(--fb-card));
  --fg:var(--primary-text-color,var(--fb-fg));
  --muted:var(--secondary-text-color,var(--fb-muted));
  --line:var(--divider-color,var(--fb-line));
  --accent:var(--fb-accent);--ink:var(--fb-ink);--danger:var(--fb-danger);--tint:var(--fb-tint);
}
@media (hover:hover) and (pointer:fine) and (min-width:900px){:root{--tap:36px}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html.lock,html.lock body{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 var(--sans);-webkit-font-smoothing:antialiased;min-height:100dvh}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
.mono{font-family:var(--mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
mark{background:none;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}
kbd{font:600 11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:1px 5px;color:var(--muted)}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}

/* simulator bar */
.sim{background:var(--fg);color:var(--bg);font:12px var(--mono)}
.sim-row{display:flex;align-items:center;gap:10px;min-height:44px}
.sim button,.sim a{color:inherit}
.sim-tg{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 4px;font:700 12px var(--mono);letter-spacing:.08em}
.sim-tg svg{transition:transform .15s}
.sim-tg[aria-expanded="true"] svg{transform:rotate(180deg)}
.sim-log{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.75}
.sim-panel{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 12px}
.sim-panel[hidden]{display:none}
.sim-panel button,.sim-panel a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid currentColor;border-radius:var(--r);text-decoration:none;font:600 12px var(--mono)}
.sim-panel button[aria-pressed="true"]{background:var(--accent);color:var(--ink);border-color:var(--accent)}

/* banner */
.banner{display:flex;gap:10px;align-items:flex-start;margin:12px 0 0;padding:10px 12px;border:1px solid var(--danger);border-left-width:4px;background:var(--card);border-radius:var(--r)}
.banner[hidden]{display:none}
.banner p{margin:0;flex:1;padding:10px 0;font-size:14px}
.banner b{color:var(--danger)}
.banner button{min-height:var(--tap);min-width:var(--tap);padding:0 12px;font:600 13px var(--mono);border:1px solid var(--line);border-radius:var(--r)}

/* hero */
.hero{padding:22px 0 14px}
.brand{font:600 12px var(--mono);letter-spacing:.04em;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.brand .sl{color:var(--accent)}
h1{margin:10px 0 0;font-size:clamp(28px,7vw,44px);line-height:1.05;letter-spacing:-.035em;font-weight:700}
h1::after{content:"";display:inline-block;width:.12em;height:.82em;margin-left:.1em;background:var(--accent);vertical-align:-.06em;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.stick{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:8px;margin-top:10px;height:56px;border:1.5px solid var(--fg);border-radius:var(--r);background:var(--card);padding:0 6px 0 14px}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--tint)}
.prompt{font:700 20px var(--mono);color:var(--accent)}
.search input{flex:1;min-width:0;height:100%;border:0;background:none;outline:0;font-size:18px;caret-color:var(--accent)}
.search input::placeholder{color:var(--muted);opacity:1}
.kbtn{display:none;align-items:center;gap:8px;height:42px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r);font:600 12px var(--mono);color:var(--muted)}
.kbtn:hover{border-color:var(--accent);color:var(--fg)}
.clr{display:none;width:var(--tap);height:var(--tap);align-items:center;justify-content:center;color:var(--muted)}
.clr.on{display:flex}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:var(--tap);padding:0 14px;border:1px solid var(--line);border-radius:999px;font:600 13px var(--mono);color:var(--muted);background:var(--card)}
.chip b{font-weight:600;opacity:.7}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.chip[aria-pressed="true"] b{opacity:.8}

/* list */
main{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.grp{margin-top:22px}
.ghead{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--fg);padding-bottom:4px}
.gt{flex:1;min-width:0}
.gname{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em;text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gmeta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:38px minmax(0,1fr) auto 44px;grid-template-areas:"tag main val more" "tag src val more";column-gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);min-height:68px}
.tag{grid-area:tag;align-self:center;display:flex;align-items:center;justify-content:center;height:30px;border:1px solid var(--fg);border-radius:2px;font:700 10px var(--mono);letter-spacing:.04em}
.t-energy{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.rmain{grid-area:main;min-width:0}
.rname{font-weight:650;font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsub,.rsrc{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rsrc{grid-area:src}
.arr{color:var(--accent)}
.rval{grid-area:val;font:600 14px var(--mono);text-align:right;white-space:nowrap}
.rval i{font-style:normal;color:var(--muted);margin-left:3px;font-weight:500}
.st{display:inline-flex;align-items:center;gap:6px;text-transform:uppercase;font-size:12px;letter-spacing:.06em}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.st-on .dot{background:var(--accent);box-shadow:0 0 0 3px var(--tint)}
.st-off{color:var(--muted)}
.racts{grid-area:more;display:flex;justify-content:flex-end}
.ib{display:inline-flex;align-items:center;justify-content:center;width:var(--tap);height:var(--tap);border-radius:var(--r);color:var(--muted)}
.ib:hover{color:var(--fg);background:var(--tint)}
.ib.dng:hover{color:var(--danger)}
.ib svg{width:20px;height:20px}
.ib-inline{display:none}
.rowempty{padding:14px 0;color:var(--muted);font-size:14px;border-bottom:1px solid var(--line)}
.rowempty button{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:var(--tap);padding:0 6px}
.empty{margin:44px 0;padding:28px 18px;border:1px dashed var(--muted);border-radius:var(--r);text-align:center}
.empty h2{margin:0 0 6px;font-size:20px;letter-spacing:-.02em}
.empty p{margin:0 0 16px;color:var(--muted)}
.empty .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border:1.5px solid var(--fg);border-radius:var(--r);font:700 14px var(--mono)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.dng{background:var(--danger);border-color:var(--danger);color:var(--bg)}
.sk{height:68px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,transparent,var(--tint),transparent);background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}

@media (min-width:700px){
  .row{grid-template-columns:44px minmax(0,1.3fr) minmax(0,1fr) 120px auto;grid-template-areas:"tag main src val more";min-height:60px}
  .rsrc{font-size:12px}
  .racts{gap:2px}
  .ib-inline{display:inline-flex}
  .ib-more{display:none}
  .ghead{padding-bottom:6px}
}
@media (min-width:900px){
  .kbtn{display:inline-flex}
  .cmdbar{display:none!important}
  main{padding-bottom:80px}
}

/* bottom command bar */
.cmdbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:8px;padding:10px max(12px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:var(--bg);border-top:1px solid var(--fg)}
.cmd{flex:1;display:flex;align-items:center;gap:10px;height:52px;padding:0 14px;border:1.5px solid var(--fg);border-radius:var(--r);background:var(--card);font:600 15px var(--mono);color:var(--muted);text-align:left}
.cmd .prompt{font-size:18px}
.cmd svg{margin-left:auto;color:var(--fg)}
.fab{width:52px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:var(--r);background:var(--accent);color:var(--ink)}

/* toasts */
.toasts{position:fixed;z-index:60;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:calc(84px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;position:relative;overflow:hidden;width:min(520px,100%);display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;min-height:52px;background:var(--fg);color:var(--bg);border-radius:var(--r);font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.35);animation:up .18s ease-out}
.toast span{flex:1;padding:8px 0}
.toast button{min-height:44px;padding:0 14px;font:700 13px var(--mono);color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
:root:not([data-theme="dark"]) .toast button{color:#fff;text-decoration:underline}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast button{color:#2a1ee0}}
:root[data-theme="dark"] .toast button{color:#2a1ee0}
.toast i{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--accent);transform-origin:left;animation:drain var(--ms) linear forwards}
@keyframes drain{to{transform:scaleX(0)}}
@media (min-width:900px){.toasts{bottom:24px}}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}

/* palette */
.pal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.pal[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet{position:relative;width:100%;height:min(90dvh,760px);background:var(--card);border-top:3px solid var(--accent);display:flex;flex-direction:column;animation:up .18s ease-out;padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.ph{order:1;display:flex;align-items:center;gap:6px;padding:6px 8px 0 6px}
.pb,.px{width:var(--tap);min-width:var(--tap);height:var(--tap);display:flex;align-items:center;justify-content:center;color:var(--muted);border-radius:var(--r)}
.pb:hover,.px:hover{color:var(--fg);background:var(--tint)}
.pb[hidden]{display:none}
.pcr{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;align-items:center}
.pcr::-webkit-scrollbar{display:none}
.crumb{flex:none;max-width:42vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:32px;display:inline-flex;align-items:center;padding:0 10px;border:1px solid var(--line);border-radius:999px;font:600 12px var(--mono);color:var(--muted)}
button.crumb:hover{border-color:var(--accent);color:var(--fg)}
.crumb.fixed{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pt{order:2;padding:6px 16px 8px}
.pt h2{margin:0;font-size:20px;letter-spacing:-.025em;line-height:1.15}
.pt p{margin:4px 0 0;color:var(--muted);font-size:13px}
.pbody{order:3;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;padding:0 8px 6px}
.pbody>:first-child{margin-top:auto}
.perr{order:4;margin:0 12px 8px;padding:8px 10px;border-left:4px solid var(--danger);background:var(--tint);font-size:13px}
.perr[hidden]{display:none}
.pin{order:5;display:flex;align-items:center;gap:8px;margin:8px 12px;height:54px;padding:0 12px;border:1.5px solid var(--fg);border-radius:var(--r);background:var(--bg)}
.pin[hidden]{display:none}
.pin:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--tint)}
.pin input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;font:500 17px var(--mono);caret-color:var(--accent)}
.pin input::placeholder{color:var(--muted);opacity:1}
.pfoot{order:6;display:flex;align-items:center;gap:10px;padding:0 12px 12px}
.pfoot .btn{flex:1}
.pfoot .btn[hidden]{display:none}
.hints{display:none;color:var(--muted);font-size:11px;flex:1}
@media (hover:hover) and (pointer:fine){.hints{display:block}.pfoot:has(.btn[hidden]){padding-bottom:8px}}
.opt{display:flex;align-items:center;gap:12px;min-height:54px;padding:6px 10px;border-radius:var(--r);border-left:3px solid transparent;cursor:pointer}
.opt[aria-selected="true"]{background:var(--tint);border-left-color:var(--accent)}
.otag{flex:none;min-width:34px;height:24px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:2px;font:700 10px var(--mono);color:var(--muted);padding:0 4px}
.opt[aria-selected="true"] .otag{border-color:var(--accent);color:var(--fg)}
.otx{flex:1;min-width:0;display:flex;flex-direction:column}
.ol{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.os{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.os.wrap2{white-space:normal}
.oright{flex:none;font-size:12px;color:var(--muted);text-align:right;max-width:34%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;margin-left:6px;padding:0 6px;border:1px solid var(--accent);border-radius:2px;font:700 10px var(--mono);color:var(--fg);vertical-align:2px}
.pempty{padding:20px 14px;color:var(--muted);font-size:13px}
.sum{padding:6px 8px 4px}
.sumtext{margin:0 0 14px;font-size:17px;line-height:1.4;letter-spacing:-.01em}
.sumtext b{background:var(--tint);box-shadow:inset 0 -2px 0 var(--accent);font-weight:650;padding:0 2px;word-break:break-word}
.kv{margin:0;border:1px solid var(--line);border-radius:var(--r);font-size:12px}
.kv div{display:flex;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line)}
.kv div:last-child{border-bottom:0}
.kv dt{flex:none;width:92px;color:var(--muted)}
.kv dd{margin:0;min-width:0;word-break:break-word}
.note{margin:12px 0 0;font-size:13px;color:var(--muted)}
@media (min-width:700px){
  .pal{align-items:flex-start;padding-top:9vh}
  .sheet{width:min(680px,calc(100% - 32px));height:min(580px,82vh);border:1px solid var(--fg);border-top:3px solid var(--accent);box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .pin{order:3;margin:4px 12px 8px}
  .pbody{order:4}
  .pbody>:first-child{margin-top:0}
  .perr{order:5}
  .pfoot{order:6}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app">
  <div class="sim">
    <div class="wrap">
      <div class="sim-row">
        <button class="sim-tg" id="simtg" aria-expanded="false" aria-controls="simpanel">SIM <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
        <span class="sim-log" id="log" aria-live="off">api idle</span>
      </div>
      <div class="sim-panel" id="simpanel" hidden>
        <button id="sToggle">Toggle source state</button>
        <button id="sFail" aria-pressed="false">Next call fails</button>
        <button id="sReset">Reset data</button>
        <button id="sTheme">Dark</button>
        <a href="../index.html">&larr; All concepts</a>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="banner" id="banner" role="alert" hidden></div>
    <section class="hero">
      <div class="brand"><span>magnolia<span class="sl">/</span>proxy</span><span id="counts"></span></div>
      <h1>What are we changing?</h1>
    </section>
  </div>
  <div class="stick">
    <div class="wrap">
      <div class="search" role="search">
        <span class="prompt" aria-hidden="true">&rsaquo;</span>
        <label class="sr" for="q">Filter proxies</label>
        <input id="q" type="search" placeholder="Filter proxies, entities, devices" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
        <button class="clr" id="qclr" aria-label="Clear filter"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 4l10 10M14 4L4 14" stroke="currentColor" stroke-width="2" fill="none"/></svg></button>
        <button class="kbtn" id="openpal" aria-haspopup="dialog">Actions <kbd id="kk">Ctrl K</kbd></button>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Filter by type"></div>
    </div>
  </div>
  <main class="wrap" id="list" aria-live="off"></main>

  <div class="cmdbar">
    <button class="cmd" id="cmdopen" aria-haspopup="dialog"><span class="prompt" aria-hidden="true">&rsaquo;</span><span>Type a command</span>
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 3a2.5 2.5 0 100 5h6a2.5 2.5 0 100-5 2.5 2.5 0 00-2.5 2.5V14.5A2.5 2.5 0 1013 17a2.5 2.5 0 00-2.5-2.5H9.5A2.5 2.5 0 007 17a2.5 2.5 0 102.5-2.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
    <button class="fab" id="fabnew" aria-label="New proxy"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M11 3v16M3 11h16" stroke="currentColor" stroke-width="2.4"/></svg></button>
  </div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<div class="pal" id="pal" hidden>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ptitle" id="sheet">
    <div class="ph">
      <button class="pb" id="pback" aria-label="Back" hidden><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4L6 10l6 6" stroke="currentColor" stroke-width="2" fill="none"/></svg></button>
      <div class="pcr" id="pcr"></div>
      <button class="px" id="pclose" aria-label="Close"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 4l10 10M14 4L4 14" stroke="currentColor" stroke-width="2" fill="none"/></svg></button>
    </div>

<script src="../mock-backend.js"></script>
<script>
(() => {
"use strict";
const M = window.MagnoliaMock;
const API = (m, p, b) => M.callApi(m, p, b);
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const b = (x) => "<b>" + esc(x) + "</b>";
const slug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");
const n3 = (x) => (Number.isFinite(+x) && x !== "" && x != null ? (+x).toFixed(3) : String(x));
const errMsg = (e) => (e && e.body && e.body.message) || (e && e.message) || "Unknown error";
const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
$("#kk").textContent = IS_MAC ? "⌘K" : "Ctrl K";

const S = { data: null, loading: true, error: null, filter: "all", q: "", pending: new Map(), toasts: [], hist: {} };
const P = { open: false, flow: null, scope: null, q: "", active: 0, items: [], err: null, busy: false, opener: null, key: "", sm: null };
const TAG = { light: "LGT", switch: "SWT", fan: "FAN", sensor: "SNS", energy: "NRG" };
const VERB = { newProxy: "New proxy", newDevice: "New device", replace: "Replace device", swap: "Swap source", rename: "Rename", delProxy: "Delete proxy", delDevice: "Delete device" };
const ICON = {
  swap: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 7h13M13 4l3 3-3 3M17 13H4M7 10l-3 3 3 3"/></svg>',
  edit: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 17l1-4L14 3l3 3L7 16z"/></svg>',
  del: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6h12M8 6V4h4v2M6 6l1 11h6l1-11"/></svg>',
  more: '<svg viewBox="0 0 20 20" fill="currentColor"><circle cx="4.5" cy="10" r="1.7"/><circle cx="10" cy="10" r="1.7"/><circle cx="15.5" cy="10" r="1.7"/></svg>',
  plus: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 4v12M4 10h12"/></svg>',
};

/* ---------- fuzzy ---------- */
const WS = /[\s._\-/]/;
function fz1(t, text) {
  const l = text.toLowerCase(), i = l.indexOf(t);
  if (i >= 0) {
    const idx = []; for (let k = 0; k < t.length; k++) idx.push(i + k);
    return { s: 100 + (i === 0 || WS.test(l[i - 1]) ? 30 : 0) - i * 0.5 + (t.length / l.length) * 10, idx };
  }
  let j = 0, s = 0, prev = -2; const idx = [];
  for (let k = 0; k < l.length && j < t.length; k++) {
    if (l[k] === t[j]) { idx.push(k); s += (k === prev + 1 ? 8 : 2) + (k === 0 || WS.test(l[k - 1]) ? 6 : 0); prev = k; j++; }
  }
  return j === t.length ? { s, idx } : null;
}
function fuzzy(q, text, extra = "") {
  const toks = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  if (!toks.length) return { s: 0, idx: new Set() };
  let s = 0; const idx = new Set();
  for (const t of toks) {
    let r = fz1(t, text);
    if (!r && extra) { const r2 = fz1(t, text + " " + extra); if (r2) r = { s: r2.s * 0.4, idx: r2.idx.filter((i) => i < text.length) }; }
    if (!r) return null;
    s += r.s; r.idx.forEach((i) => idx.add(i));
  }
  return { s, idx };
}
function hl(text, idx) {
  if (!idx || !idx.size) return esc(text);
  let o = "", on = false;
  for (let i = 0; i < text.length; i++) {
    const m = idx.has(i);
    if (m && !on) { o += "<mark>"; on = true; }
    if (!m && on) { o += "</mark>"; on = false; }
    o += esc(text[i]);
  }
  return on ? o + "</mark>" : o;
}

/* ---------- state view ---------- */
function view() {
  const d = S.data;
  if (!d) return { devices: [], unassigned: [], proxies: [], sources: [], real: [] };
  const devices = d.devices.filter((x) => !S.pending.has("d:" + x.id)).map((dev) => ({
    ...dev, proxies: dev.proxies.filter((p) => !S.pending.has("p:" + p.id)).map((p) => ({ ...p, _dev: dev })),
  }));
  const unassigned = d.unassigned_proxies.filter((p) => !S.pending.has("p:" + p.id)).map((p) => ({ ...p, _dev: null }));
  return { devices, unassigned, proxies: [...devices.flatMap((x) => x.proxies), ...unassigned], sources: d.source_entities, real: d.real_devices || [] };
}
const kindOf = (p) => (p.is_energy ? "energy" : p.domain);
function stateTxt(s) {
  if (s.state === "on" || s.state === "off") return s.state;
  return s.state + (s.unit_of_measurement ? " " + s.unit_of_measurement : "");
}
function valTxt(p) {
  if (p.is_energy) return n3(p.live_state) + " " + (p.unit || "");
  if (p.domain === "sensor") return p.live_state + (p.unit_of_measurement ? " " + p.unit_of_measurement : "");
  return p.live_state;
}
function valHtml(p) {
  if (p.is_energy) return `${esc(n3(p.live_state))}<i>${esc(p.unit || "")}</i>`;
  if (p.domain === "sensor") return `${esc(p.live_state)}<i>${esc(p.unit_of_measurement || "")}</i>`;
  const s = p.live_state;
  return `<span class="st st-${s === "on" ? "on" : "off"}"><span class="dot"></span>${esc(s)}</span>`;
}
function compat(p, s, srcs) {
  const cur = srcs.find((x) => x.entity_id === p.source_entity);
  if (s.domain !== p.domain) return false;
  if (p.unit && s.unit_of_measurement !== p.unit) return false;
  if (p.is_energy) return s.is_energy;
  return !cur || !cur.device_class || s.device_class === cur.device_class;
}
const ago = (t) => { const d = Date.now() / 1000 - t; return d < 3600 ? Math.max(1, Math.round(d / 60)) + "m ago" : d < 86400 ? Math.round(d / 3600) + "h ago" : Math.round(d / 86400) + "d ago"; };

/* ---------- focus-safe html swap ---------- */
function swapHtml(el, html, cacheKey) {
  if (el[cacheKey] === html) return;
  el[cacheKey] = html;
  const a = document.activeElement;
  const k = a && el.contains(a) && a.dataset ? a.dataset.k : null;
  const sl = el.scrollLeft;
  el.innerHTML = html;
  el.scrollLeft = sl;
  if (k) { const n = el.querySelector(`[data-k="${CSS.escape(k)}"]`); if (n) n.focus({ preventScroll: true }); }
}

/* ---------- main render ---------- */
const FILTERS = [["all", "All"], ["light", "Light"], ["switch", "Switch"], ["fan", "Fan"], ["sensor", "Sensor"], ["energy", "Energy"], ["unassigned", "Unassigned"]];
function passFilter(p, f) {
  if (f === "all") return true;
  if (f === "unassigned") return !p._dev;
  if (f === "energy") return p.is_energy;
  return p.domain === f;
}
function renderAll() { renderBanner(); renderChips(); renderList(); }
function renderBanner() {
  const el = $("#banner");
  if (!S.error) { el.hidden = true; el.innerHTML = ""; el._h = null; return; }
  const h = `<p><b>Error.</b> ${esc(S.error.msg)}</p>${S.error.retry ? '<button id="bretry">Retry</button>' : ""}<button id="bdis" aria-label="Dismiss error">&times;</button>`;
  el.hidden = false; swapHtml(el, h, "_h");
}
function showError(msg, retry) { S.error = { msg, retry: !!retry }; renderBanner(); }
function renderChips() {
  const v = view();
  const h = FILTERS.map(([k, l]) => {
    const n = v.proxies.filter((p) => passFilter(p, k)).length;
    return `<button class="chip" data-k="chip:${k}" data-f="${k}" aria-pressed="${S.filter === k}">${l} <b>${n}</b></button>`;
  }).join("");
  swapHtml($("#chips"), h, "_h");
  $("#counts").textContent = S.data ? `${v.proxies.length} proxies / ${v.devices.length} devices` : "";
}
function rowHtml(p, idx) {
  const k = kindOf(p), nm = hlq(p.name, p);
  const n = esc(p.name);
  return `<li class="row"><div class="tag t-${k}" aria-hidden="true">${TAG[k]}</div>
  <div class="rmain" data-row="${esc(p.id)}"><div class="rname">${nm}</div><div class="rsub mono">${esc(p.entity_id)}</div></div>
  <div class="rsrc mono" data-row="${esc(p.id)}"><span class="arr">&rarr;</span> ${esc(p.source_entity)}</div>
  <div class="rval" data-row="${esc(p.id)}">${valHtml(p)}</div>
  <div class="racts">
    <button class="ib ib-inline" data-act="swap" data-id="${esc(p.id)}" data-k="s:${esc(p.id)}" aria-label="Swap source of ${n}" title="Swap source">${ICON.swap}</button>
    <button class="ib ib-inline" data-act="rename" data-id="${esc(p.id)}" data-k="r:${esc(p.id)}" aria-label="Rename ${n}" title="Rename">${ICON.edit}</button>
    <button class="ib ib-inline dng" data-act="delete" data-id="${esc(p.id)}" data-k="x:${esc(p.id)}" aria-label="Delete ${n}" title="Delete">${ICON.del}</button>
    <button class="ib ib-more" data-act="menu" data-id="${esc(p.id)}" data-k="m:${esc(p.id)}" aria-label="Actions for ${n}" aria-haspopup="dialog">${ICON.more}</button>
  </div></li>`;
}
function hlq(name, p) {
  if (!S.q.trim()) return esc(name);
  const r = fuzzy(S.q, name);
  return r ? hl(name, r.idx) : esc(name);
}
function renderList() {
  const el = $("#list");
  let h;
  if (S.loading) h = '<div class="grp" aria-busy="true" aria-label="Loading"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>';
  else if (!S.data) h = `<div class="empty"><h2>Couldn't load</h2><p>The state request failed.</p><div class="acts"><button class="btn pri" data-act="reload">Retry</button></div></div>`;
  else {
    const v = view(), q = S.q.trim(), filtering = q || S.filter !== "all";
    const match = (p) => {
      if (!passFilter(p, S.filter)) return false;
      if (!q) return true;
      return !!fuzzy(q, p.name, `${p.entity_id} ${p.source_entity} ${p._dev ? p._dev.name : "unassigned"} ${p.domain}`);
    };
    const groups = [];
    for (const d of v.devices) groups.push({ id: d.id, name: d.name, meta: d.model, dev: d, ps: d.proxies.filter(match) });
    if (v.unassigned.length || S.filter === "unassigned") groups.push({ id: null, name: "Unassigned", meta: "not on any device", dev: null, ps: v.unassigned.filter(match) });
    const shown = groups.filter((g) => !filtering || g.ps.length);
    if (!v.devices.length && !v.unassigned.length) {
      h = `<div class="empty"><h2>Nothing here yet</h2><p>Create a virtual device, then add proxies that mirror real entities.</p><div class="acts"><button class="btn pri" data-act="newdev">New device</button><button class="btn" data-act="newproxy">New proxy</button></div></div>`;
    } else if (!shown.length) {
      h = `<div class="empty"><h2>No match</h2><p>Nothing fits ${q ? "&ldquo;" + esc(q) + "&rdquo;" : "this filter"}.</p><div class="acts"><button class="btn" data-act="clear">Clear filters</button></div></div>`;
    } else {
      h = shown.map((g) => {
        const gid = "g-" + (g.id || "un");
        const acts = g.dev ? `<button class="ib" data-act="gadd" data-id="${esc(g.id)}" data-k="ga:${esc(g.id)}" aria-label="Add proxy to ${esc(g.name)}">${ICON.plus}</button><button class="ib" data-act="gmenu" data-id="${esc(g.id)}" data-k="gm:${esc(g.id)}" aria-label="Actions for device ${esc(g.name)}" aria-haspopup="dialog">${ICON.more}</button>` : `<button class="ib" data-act="gadd" data-id="" data-k="ga:un" aria-label="Add unassigned proxy">${ICON.plus}</button>`;
        const rows = g.ps.length ? g.ps.map(rowHtml).join("") : `<li class="rowempty">No proxies on this device. <button data-act="gadd" data-id="${esc(g.id)}">Add one</button></li>`;
        return `<section class="grp" aria-labelledby="${gid}"><header class="ghead"><div class="gt"><h2 class="gname" id="${gid}">${esc(g.name)}</h2><div class="gmeta mono">${esc(g.meta || "")} &middot; ${g.ps.length}</div></div>${acts}</header><ul class="rows">${rows}</ul></section>`;
      }).join("");
    }

}

/* ---------- data ---------- */
async function load(silent) {
  try {
    S.data = await API("GET", "magnolia_proxy/state");
    if (S.error && S.error.load) S.error = null;
  } catch (e) {
    if (!silent || !S.data) { S.error = { msg: "Could not load state: " + errMsg(e), retry: true, load: true }; }
  }
  S.loading = false;
  renderAll();
  if (P.open) renderPal();
}

/* ---------- toasts & deferred delete ---------- */
let tid = 0;
function toast(text, o = {}) {
  const t = { id: ++tid, text, undo: o.undo, commit: o.commit, ms: o.ms || 6000 };
  S.toasts.push(t);
  t.timer = setTimeout(() => finish(t, true), t.ms);
  renderToasts();
  return t;
}
function finish(t, commit) {
  clearTimeout(t.timer);
  S.toasts = S.toasts.filter((x) => x !== t);
  renderToasts();
  if (commit && t.commit) t.commit();
}
function renderToasts() {
  const el = $("#toasts");
  const ids = S.toasts.map((t) => t.id).join(",");
  if (el._ids === ids) return;
  el._ids = ids;
  el.innerHTML = "";
  for (const t of S.toasts) {
    const d = document.createElement("div");
    d.className = "toast";
    d.innerHTML = `<span>${esc(t.text)}</span>${t.undo ? '<button>Undo</button>' : '<button aria-label="Dismiss">&times;</button>'}${t.undo ? `<i style="--ms:${t.ms}ms"></i>` : ""}`;
    d.querySelector("button").addEventListener("click", () => { clearTimeout(t.timer); S.toasts = S.toasts.filter((x) => x !== t); if (t.undo) t.undo(); renderToasts(); });
    el.appendChild(d);
  }
}
function deferDelete(kind, id, label) {
  const key = (kind === "proxy" ? "p:" : "d:") + id;
  S.pending.set(key, true);
  renderAll();
  toast(`Deleted ${label}`, {
    ms: 6000,
    undo: () => { S.pending.delete(key); renderAll(); },
    commit: async () => {
      try { await API("DELETE", `magnolia_proxy/${kind === "proxy" ? "proxies" : "devices"}/${id}`); }
      catch (e) { if (e.status !== 404) showError(`Couldn't delete ${label}: ${errMsg(e)}`); }
      S.pending.delete(key);
      await load(true);
    },
  });
}

/* ---------- palette flows ---------- */
const energyOpts = (total, reading, u, onPick) => [
  { key: "continue", tag: "SUM", label: "Continue running total", sub: `Keeps ${n3(total)} ${u} and adds new increases` },
  { key: "zero", tag: "0", label: "Restart at 0", sub: `Total resets from ${n3(total)} to 0 ${u}` },
  { key: "source", tag: "SRC", label: "Start at new source's reading", sub: `Total becomes ${n3(reading)} ${u}` },
].map((o) => ({ ...o, pick: () => onPick(o.key) }));
const emodeSentence = (m, total, reading, u) =>
  m === "zero" ? `The total restarts at ${b("0 " + u)}.`
  : m === "source" ? `The total jumps to ${b(n3(reading) + " " + u)}, the new source's current reading.`
  : `The total stays at ${b(n3(total) + " " + u)} and keeps counting up from the new source.`;

function getHist(unit) {
  const c = S.hist[unit];
  if (c) return c;
  const e = (S.hist[unit] = { state: "loading", items: [] });
  API("GET", "magnolia_proxy/energy_history?unit=" + encodeURIComponent(unit))
    .then((r) => { e.state = "ok"; e.items = (r.items || []).slice().sort((a, b2) => (b2.seamless - a.seamless) || (b2.last_time - a.last_time)); })
    .catch((er) => { e.state = "err"; e.err = errMsg(er); delete S.hist[unit]; })
    .finally(() => renderPal());
  return e;
}

function flowSteps(f) {
  const d = f.data, v = view(), st = [];
  const byP = (id) => v.proxies.find((p) => p.id === id);
  const byD = (id) => v.devices.find((x) => x.id === id);
  const srcBy = (id) => v.sources.find((s) => s.entity_id === id);
  const confirm = (summary) => ({ id: "confirm", kind: "confirm", title: "Review", summary });
  const proxyStep = (verb) => ({
    id: "proxy", kind: "choice", title: `${verb} which proxy?`, ph: "Filter proxies", chip: () => byP(d.proxyId)?.name,
    empty: "No proxies yet.",
    items: () => v.proxies.map((p) => ({ label: p.name, sub: `${p._dev ? p._dev.name : "Unassigned"} · ${p.entity_id}`, tag: TAG[kindOf(p)], right: valTxt(p), extra: p.entity_id, pick: () => { d.proxyId = p.id; } })),
  });
  const deviceStep = (verb) => ({
    id: "vdev", kind: "choice", title: `${verb} which device?`, ph: "Filter devices", chip: () => byD(d.vdev)?.name, empty: "No devices yet.",
    items: () => v.devices.map((x) => ({ label: x.name, sub: `${x.model} · ${x.proxies.length} proxies`, tag: "DEV", pick: () => { d.vdev = x.id; } })),
  });

  if (f.kind === "newProxy") {
    st.push({
      id: "source", kind: "choice", title: "Mirror which entity?", sub: "The real entity this proxy will follow. You can swap it later.", ph: "Search entities", chip: () => srcBy(d.src)?.name,
      items: () => v.sources.map((s) => ({ label: s.name, sub: s.entity_id, tag: s.is_energy ? "NRG" : TAG[s.domain], right: stateTxt(s), pick: () => { d.src = s.entity_id; if (!d.nameTouched) d.name = s.name; } })),
    });
    st.push({
      id: "name", kind: "text", key: "name", title: "Name it", sub: "Shown in Home Assistant.", ph: "Proxy name", chip: () => d.name,
      onInput: () => { d.nameTouched = true; }, validate: (x) => (x ? null : "A name is required."),
    });
    if (!d.devFixed) st.push({
      id: "device", kind: "choice", title: "Put it on which device?", ph: "Filter devices", chip: () => (d.dev === null ? "Unassigned" : byD(d.dev)?.name),
      items: () => [{ label: "No device", sub: "Leave unassigned for now", tag: "∅", pick: () => { d.dev = null; } },
        ...v.devices.map((x) => ({ label: x.name, sub: `${x.model} · ${x.proxies.length} proxies`, tag: "DEV", pick: () => { d.dev = x.id; } }))],
    });
    const s = srcBy(d.src);

        id: "estart", kind: "choice", title: "Where does the counter start?", sub: `Energy counter in ${u}.`, ph: "Filter options",

        items: () => [

          { key: "source", tag: "SRC", label: "At the source's reading", sub: `Starts at ${n3(s.state)} ${u}` },
          { key: "history", tag: "HIS", label: "Continue an old meter's history", sub: "Carry on from a recorded entity" },
        ].map((o) => ({ ...o, pick: () => { d.emode = o.key; } })),
      });
      if (d.emode === "history") st.push({
        id: "ehist", kind: "choice", title: "Continue which history?", sub: `Recorded ${u} entities. Seamless ones hand over their entity ID.`, ph: "Filter recorded entities",
        chip: () => d.hist, empty: `No recorded ${u} history.`,
        loading: () => getHist(u).state === "loading",
        items: () => getHist(u).items.map((h) => ({
          label: h.name, sub: `${h.entity_id} · ${n3(h.last_value)} ${u} · ${ago(h.last_time)}`, tag: "HIS", right: h.seamless ? "" : h.exists ? "in use" : "",
          badge: h.seamless ? "takes over ID" : "", pick: () => { d.hist = h.entity_id; },
        })),
      });
    }
    st.push(confirm(() => {
      const s2 = srcBy(d.src), dev = d.dev ? byD(d.dev) : null, name = (d.name || "").trim();
      if (!s2) return { ok: false, text: "Pick a source first." };
      let eid = `${s2.domain}.${slug(name)}${dev ? "_" + slug(dev.name) : ""}`, es = null, en = "", payload = {};
      if (s2.is_energy) {
        const u = s2.unit_of_measurement, m = d.emode || "zero";
        if (m === "zero") { en = `Energy will start from ${b("0 " + u)} and count up from now.`; es = { mode: "zero" }; }
        else if (m === "source") { en = `Energy will start from ${b(n3(s2.state) + " " + u)}, the current reading of ${b(s2.entity_id)}.`; es = { mode: "source" }; }
        else {
          const h = getHist(u).items.find((x) => x.entity_id === d.hist);
          if (!h) return { ok: false, text: "Pick a history to continue." };
          en = `Energy will start from ${b(n3(h.last_value) + " " + u)} and continue ${b(h.entity_id)}.` + (h.seamless ? " The new sensor takes over that entity ID, so existing graphs carry on." : " It gets its own entity ID; the old history only seeds the total.");
          if (h.seamless) eid = h.entity_id;
          es = { mode: "history", entity_id: h.entity_id };
        }
      }
      const text = `Create ${b(s2.is_energy ? "energy" : s2.domain)} proxy ${b(name)} ${dev ? "on " + b(dev.name) : "with " + b("no device")}, mirroring ${b(s2.entity_id)}. ${en}`;
      const lines = [["Name", name], ["Source", s2.entity_id], ["Device", dev ? dev.name : "Unassigned"], ["Entity ID", eid]];
      if (es) lines.push(["Energy", es.mode === "zero" ? "from 0" : es.mode === "source" ? "at source reading" : "history " + es.entity_id]);
      return {
        ok: true, text, lines, cta: "Create proxy",
        run: async () => {
          const body = { name, source_entity: s2.entity_id, virtual_device_id: dev ? dev.id : null };
          if (es) body.energy_start = es;
          await API("POST", "magnolia_proxy/proxies", body);
          closePal(); toast(`Created proxy ${name}`); load(true);
        },
      };
    }));
  }

  if (f.kind === "newDevice") {
    st.push({ id: "name", kind: "text", key: "name", title: "Name the device", sub: "A virtual device groups proxies.", ph: "Device name", chip: () => d.name, validate: (x) => (x ? null : "A name is required.") });
    st.push({ id: "model", kind: "text", key: "model", title: "Model", sub: "Optional label shown under the name.", ph: "Virtual Device", def: () => "Virtual Device", chip: () => d.model });
    st.push(confirm(() => {
      const name = (d.name || "").trim(), model = (d.model || "").trim() || "Virtual Device";
      return {
        ok: true, text: `Create virtual device ${b(name)} (${esc(model)}). It starts empty; add proxies afterwards.`, lines: [["Name", name], ["Model", model]], cta: "Create device",
        run: async () => { await API("POST", "magnolia_proxy/devices", { name, model }); closePal(); toast(`Created device ${name}`); load(true); },
      };
    }));
  }

  if (f.kind === "swap") {
    if (!d.proxyId) st.push(proxyStep("Swap source of"));
    const p = byP(d.proxyId);
    if (p) {
      const cur = srcBy(p.source_entity), srcs = v.sources;
      const cands = srcs.filter((s) => s.entity_id !== p.source_entity && compat(p, s, srcs));
      const lockTxt = p.is_energy ? `energy sensors in ${p.unit}` : p.unit ? `${p.domain} entities in ${p.unit}` : cur && cur.device_class ? `${p.domain} entities of class ${cur.device_class}` : `${p.domain} entities`;
      st.push({
        id: "newsrc", kind: "choice", title: `New source for ${p.name}`, sub: `Locked to ${p.domain}. Showing only ${lockTxt}. Now: ${p.source_entity}`, ph: "Search compatible entities",
        chip: () => srcBy(d.newSrc)?.name, empty: "No other compatible entity available.",
        items: () => cands.map((s) => ({ label: s.name, sub: s.entity_id, tag: s.is_energy ? "NRG" : TAG[s.domain], right: stateTxt(s), pick: () => { d.newSrc = s.entity_id; } })),
      });
      if (p.is_energy) st.push({
        id: "emode", kind: "choice", title: "What happens to the total?", sub: `${p.name} currently reads ${n3(p.live_state)} ${p.unit}.`, ph: "Filter options",
        chip: () => ({ continue: "continue", zero: "restart", source: "new reading" }[d.emode]),
        items: () => energyOpts(p.live_state, srcBy(d.newSrc)?.state, p.unit, (k) => { d.emode = k; }),
      });
      st.push(confirm(() => {
        const ns = srcBy(d.newSrc);
        if (!ns) return { ok: false, text: "Pick a source." };
        const m = d.emode || "continue";
        const en = p.is_energy ? " " + emodeSentence(m, p.live_state, ns.state, p.unit) : "";
        const lines = [["Proxy", p.name], ["From", p.source_entity], ["To", ns.entity_id]];
        if (p.is_energy) lines.push(["Total", { continue: "continue running total", zero: "restart at 0", source: "start at new reading" }[m]]);
        return {
          ok: true, text: `Point ${b(p.name)} at ${b(ns.entity_id)} instead of ${b(p.source_entity)}.${en}`, lines, cta: "Swap source",
          run: async () => {
            const body = { source_entity: ns.entity_id }; if (p.is_energy) body.energy_mode = m;
            await API("PATCH", "magnolia_proxy/proxies/" + p.id, body); closePal(); toast(`${p.name} now follows ${ns.name}`); load(true);
          },
        };
      }));
    }
  }

  if (f.kind === "rename") {
    if (!d.proxyId) st.push(proxyStep("Rename"));
    const p = byP(d.proxyId);
    if (p) {
      st.push({ id: "name", kind: "text", key: "name", title: `Rename ${p.name}`, sub: p.entity_id, ph: "New name", def: () => p.name, chip: () => d.name,
        validate: (x) => (!x ? "A name is required." : x === p.name ? "That is already its name." : null) });
      st.push(confirm(() => {
        const nn = (d.name || "").trim();
        return {
          ok: true, text: `Rename ${b(p.name)} to ${b(nn)}.`, lines: [["Was", p.name], ["Now", nn]], cta: "Rename",
          run: async () => { await API("PATCH", "magnolia_proxy/proxies/" + p.id, { name: nn }); closePal(); toast(`Renamed to ${nn}`); load(true); },
        };
      }));
    }
  }

  if (f.kind === "delProxy") {
    if (!d.proxyId) st.push(proxyStep("Delete"));
    const p = byP(d.proxyId);
    if (p) st.push(confirm(() => ({
      ok: true, danger: true, cta: "Delete proxy",
      text: `Delete proxy ${b(p.name)} (${esc(p.entity_id)}). Its source ${b(p.source_entity)} is not touched.`,
      lines: [["Proxy", p.name], ["Entity", p.entity_id], ["Device", p._dev ? p._dev.name : "Unassigned"]],
      note: "Deletion is deferred for 6 seconds. Tap Undo in the toast to cancel.",
      run: async () => { closePal(); deferDelete("proxy", p.id, `proxy ${p.name}`); },
    })));
  }

  if (f.kind === "delDevice") {
    if (!d.vdev) st.push(deviceStep("Delete"));
    const dv = byD(d.vdev);
    if (dv) st.push(confirm(() => ({
      ok: true, danger: true, cta: "Delete device",
      text: `Delete device ${b(dv.name)} and ${dv.proxies.length ? "its " + b(dv.proxies.length + " proxies") : "nothing else (it is empty)"}.`,
      lines: [["Device", dv.name], ["Model", dv.model], ["Proxies", dv.proxies.map((x) => x.name).join(", ") || "none"]],
      note: "Deletion is deferred for 6 seconds. Tap Undo in the toast to cancel.",
      run: async () => { closePal(); deferDelete("device", dv.id, `device ${dv.name}`); },
    })));
  }

  if (f.kind === "replace") {
    if (!d.vdev) st.push(deviceStep("Replace"));
    st.push({
      id: "target", kind: "choice", title: "Replace with which real device?", sub: "Every proxy is re-mapped to matching entities on it.", ph: "Filter devices",
      chip: () => v.real.find((x) => x.id === d.real)?.name, empty: "No real devices found.",
      items: () => v.real.map((x) => ({
        label: x.name, sub: `${x.manufacturer} ${x.model} · ${x.entities.length} entities`, tag: "DEV",
        pick: async () => {
          const r = await API("POST", "magnolia_proxy/replace_plan", { virtual_device_id: d.vdev, target_device_id: x.id });
          d.real = x.id; d.plan = r.items; d.map = {}; d.emodes = {};
          r.items.forEach((it) => { d.map[it.proxy_id] = it.selected_source_entity; });
        },
      })),
    });
    if (d.plan) {
      const items = d.plan;
      for (const it of items) if (it.conflict_reason) {
        const p = byP(it.proxy_id);
        const opts = it.conflict_reason === "multiple_candidates" ? it.candidates : v.sources.filter((s) => p && s.entity_id !== it.current_source_entity && compat(p, s, v.sources)).map((s) => s.entity_id);
        st.push({
          id: "res:" + it.proxy_id, kind: "choice", ph: "Filter entities",
          title: `Which entity for ${it.proxy_name}?`,
          sub: it.conflict_reason === "multiple_candidates" ? `${opts.length} entities on the target match (${it.locked_domain}).` : `Nothing on the target matches (${it.locked_domain}). Pick manually or keep the current source.`,
          chip: () => (d.map[it.proxy_id] ? srcBy(d.map[it.proxy_id])?.name : "keep"),
          items: () => [...opts.map((id) => { const s = srcBy(id); return { label: s ? s.name : id, sub: id, tag: TAG[s ? s.domain : it.locked_domain], right: s ? stateTxt(s) : "", pick: () => { d.map[it.proxy_id] = id; } }; }),
            { label: "Keep current source", sub: it.current_source_entity, tag: "SKIP", pick: () => { d.map[it.proxy_id] = null; } }],
        });
      }
      for (const it of items) {
        const p = byP(it.proxy_id), ns = d.map[it.proxy_id] ? srcBy(d.map[it.proxy_id]) : null;
        if (p && p.is_energy && ns && ns.entity_id !== p.source_entity) st.push({
          id: "em:" + it.proxy_id, kind: "choice", ph: "Filter options", title: `Energy total for ${p.name}`, sub: `Currently ${n3(p.live_state)} ${p.unit}.`,
          chip: () => ({ continue: "continue", zero: "restart", source: "new reading" }[d.emodes[p.id] || "continue"]),
          items: () => energyOpts(p.live_state, ns.state, p.unit, (k) => { d.emodes[p.id] = k; }),
        });
      }
      st.push(confirm(() => {
        const dv = byD(d.vdev), real = v.real.find((x) => x.id === d.real);
        const lines = [], mappings = {}, energy_modes = {};
        for (const it of items) {
          const p = byP(it.proxy_id), to = d.map[it.proxy_id];
          if (!p) continue;
          if (to && to !== it.current_source_entity) {
            mappings[p.id] = to;
            let extra = "";
            if (p.is_energy) { energy_modes[p.id] = d.emodes[p.id] || "continue"; extra = " (" + { continue: "continue total", zero: "restart at 0", source: "new reading" }[energy_modes[p.id]] + ")"; }
            lines.push([p.name, `${it.current_source_entity} → ${to}${extra}`]);
          } else lines.push([p.name, to ? "already on that entity" : "kept as is"]);
        }
        const n = Object.keys(mappings).length;
        return {
          ok: n > 0, cta: n ? `Apply to ${n} proxies` : "Nothing to apply", lines,
          text: items.length ? `Re-map ${b(n + " of " + items.length + " proxies")} of ${b(dv ? dv.name : "")} onto ${b(real ? real.name : "")}.` : `${b(dv ? dv.name : "")} has no proxies to replace.`,
          run: async () => {
            const r = await API("POST", "magnolia_proxy/replace_apply", { mappings, energy_modes });
            const rej = (r.rejected || []).map((id) => byP(id)?.name || id);
            closePal(); toast(rej.length ? `Applied with ${rej.length} rejected: ${rej.join(", ")}` : `Replaced ${n} proxies`); load(true);
          },
        };
      }));
    }
  }
  return st;
}

/* ---------- palette root ---------- */
function rootItems(q) {
  const v = view(), out = [];
  const go = (kind, preset) => () => start(kind, preset);
  const gen = (label, hint, kind, preset, kw = "", tag = "›") => ({ label, hint, run: go(kind, preset), kw, tag });
  const scope = P.scope;
  const proxyActs = (p) => [
    gen(`Swap source of ${p.name}…`, p.entity_id, "swap", { proxyId: p.id }, "change source entity", "SWP"),
    gen(`Rename ${p.name}…`, p.entity_id, "rename", { proxyId: p.id }, "name", "REN"),
    gen(`Delete ${p.name}…`, p.entity_id, "delProxy", { proxyId: p.id }, "remove", "DEL"),
  ];
  const devActs = (x) => [
    gen(`Add proxy to ${x.name}…`, x.model, "newProxy", { dev: x.id, devFixed: true }, "new create", "NEW"),
    gen(`Replace device ${x.name}…`, x.model, "replace", { vdev: x.id }, "swap real hardware", "RPL"),
    gen(`Delete device ${x.name}…`, `${x.proxies.length} proxies`, "delDevice", { vdev: x.id }, "remove", "DEL"),
  ];
  if (scope) {
    if (scope.type === "proxy") { const p = v.proxies.find((x) => x.id === scope.id); if (p) out.push(...proxyActs(p)); }
    else { const x = v.devices.find((y) => y.id === scope.id); if (x) out.push(...devActs(x)); }
  } else {
    out.push(gen("New proxy…", "mirror a real entity", "newProxy", {}, "create add", "NEW"));
    out.push(gen("New device…", "virtual device", "newDevice", {}, "create add", "NEW"));
    out.push(gen("Replace device…", "re-map to real hardware", "replace", {}, "swap", "RPL"));
    out.push(gen("Swap source…", "change what a proxy follows", "swap", {}, "change entity", "SWP"));
    out.push(gen("Rename…", "rename a proxy", "rename", {}, "name", "REN"));
    out.push(gen("Delete proxy…", "with undo", "delProxy", {}, "remove", "DEL"));
    out.push(gen("Delete device…", "with undo", "delDevice", {}, "remove", "DEL"));
    if (q.trim()) { v.proxies.forEach((p) => out.push(...proxyActs(p))); v.devices.forEach((x) => out.push(...devActs(x))); }
  }
  return out.map((o) => ({ ...o, sub: o.hint }));
}

function scopeName() {
  const v = view(), s = P.scope;
  if (!s) return "";
  return s.type === "proxy" ? v.proxies.find((x) => x.id === s.id)?.name || "" : v.devices.find((x) => x.id === s.id)?.name || "";
}

/* ---------- palette engine ---------- */
const pal = $("#pal"), inp = $("#pi"), pgo = $("#pgo");
function openPal(o = {}) {
  if (!P.open) { P.opener = o.opener || document.activeElement; }
  P.open = true; P.scope = o.scope || null; P.flow = null; P.key = ""; P.err = null; P.busy = false; P.q = "";
  pal.hidden = false; $("#app").inert = true; document.documentElement.classList.add("lock");
  renderPal();
}
function closePal() {
  if (!P.open) return;
  P.open = false; P.flow = null; P.scope = null; P.busy = false; P.err = null;
  pal.hidden = true; $("#app").inert = false; document.documentElement.classList.remove("lock");
  const o = P.opener; P.opener = null;
  if (o && document.contains(o) && o.focus) o.focus({ preventScroll: true });
}
function start(kind, preset = {}) {
  if (!P.open) openPal();
  P.flow = { kind, i: 0, data: { ...preset }, cache: {} };
  P.err = null; P.q = ""; P.key = "";
  renderPal();
}
function curStep() {
  const f = P.flow; if (!f) return null;
  const st = flowSteps(f);
  if (f.i >= st.length) f.i = st.length - 1;
  return st[f.i];
}
function back() {
  if (P.busy) return;
  const f = P.flow;
  if (f && f.i > 0) { f.i--; P.err = null; renderPal(); }
  else if (f) { P.flow = null; P.err = null; renderPal(); }
  else closePal();
}
async function pickItem(i) {
  const it = P.items[i];
  if (!it || P.busy) return;
  if (!P.flow) { it.run(); return; }
  const f = P.flow;
  let r;
  try {
    r = it.pick();
    if (r && r.then) { P.busy = true; P.err = null; renderPal(); r = await r; }
  } catch (e) { P.err = errMsg(e); P.busy = false; renderPal(); return; }
  P.busy = false; P.err = null;

}
async function submit() {
  const f = P.flow; if (!f || P.busy) return;
  const step = curStep();
  if (step.kind === "text") {
    const val = (f.data[step.key] || "").trim();
    const e = step.validate ? step.validate(val) : null;
    if (e) { P.err = e; renderPal(); return; }
    f.data[step.key] = val; P.err = null; f.i++; renderPal();
  } else if (step.kind === "confirm") {
    const sm = P.sm; if (!sm || !sm.ok) return;
    P.busy = true; P.err = null; renderPal();
    try { await sm.run(); }
    catch (e) { P.err = errMsg(e); showError(errMsg(e)); P.busy = false; if (P.open) renderPal(); }
    P.busy = false;
  }
}

function renderPal() {
  if (!P.open) return;
  const f = P.flow;
  let st = null, step = null;
  if (f) { st = flowSteps(f); if (f.i >= st.length) f.i = st.length - 1; step = st[f.i]; }
  const key = f ? `${f.kind}|${f.i}|${step.id}` : `root|${P.scope ? P.scope.type + P.scope.id : ""}`;
  const changed = key !== P.key; P.key = key;
  const isText = step && step.kind === "text", isConf = step && step.kind === "confirm";

  let cr = "";
  if (f) {
    cr = `<span class="crumb fixed">${esc(VERB[f.kind])}</span>`;
    for (let j = 0; j < f.i; j++) { const c = st[j].chip && st[j].chip(); if (c != null && c !== "") cr += `<button class="crumb" data-goto="${j}" aria-label="Edit ${esc(st[j].id)}: ${esc(c)}">${esc(c)}</button>`; }
  } else cr = `<span class="crumb fixed">${P.scope ? esc(scopeName()) : "commands"}</span>`;
  $("#pcr").innerHTML = cr;
  $("#pback").hidden = !f;
  $("#ptitle").textContent = f ? step.title : P.scope ? `Actions for ${scopeName()}` : "Command palette";
  $("#psub").textContent = f ? step.sub || "" : P.scope ? "" : "Type to filter. Pick a verb, then answer a few short prompts.";
  $("#psub").hidden = !$("#psub").textContent;
  $("#pin").hidden = !!isConf;
  $("#perr").hidden = !P.err; $("#perr").textContent = P.err || "";
  $("#plabel").textContent = f ? step.title : "Command";

  if (changed) {
    P.q = ""; P.active = 0;
    if (isText) { const cur = f.data[step.key]; inp.value = cur !== undefined ? cur : step.def ? step.def(f.data) : ""; f.data[step.key] = inp.value; }
    else inp.value = "";
    inp.placeholder = f ? step.ph || "" : "Type a command, e.g. swap desk";
    inp.setAttribute("enterkeyhint", isText ? "next" : "go");
    inp.setAttribute("aria-expanded", isText || isConf ? "false" : "true");
  }

  let body = "", items = [];
  if (isConf) {
    const sm = (P.sm = step.summary());
    body = `<div class="sum"><p class="sumtext">${sm.text}</p>${sm.lines ? `<dl class="kv mono">${sm.lines.map(([k, v2]) => `<div><dt>${esc(k)}</dt><dd>${esc(v2)}</dd></div>`).join("")}</dl>` : ""}${sm.note ? `<p class="note">${esc(sm.note)}</p>` : ""}</div>`;
    pgo.className = "btn " + (sm.danger ? "dng" : "pri");
    pgo.textContent = P.busy ? "Working…" : sm.cta || "Confirm"; pgo.hidden = false; pgo.disabled = P.busy || !sm.ok;
  } else if (isText) {
    body = `<p class="pempty mono">${step.sub ? "" : ""}Press Enter or tap Continue. Esc goes back.</p>`;
    pgo.className = "btn pri"; pgo.textContent = "Continue ↵"; pgo.hidden = false; pgo.disabled = P.busy;
  } else {
    P.sm = null; pgo.hidden = true;
    let all = f ? (step.loading && step.loading() ? null : step.items()) : rootItems(P.q);
    if (all === null) body = '<div class="pempty mono">Loading…</div>';
    else {
      if (P.q.trim()) {
        all = all.map((it) => ({ it, r: fuzzy(P.q, it.label, `${it.sub || ""} ${it.kw || ""} ${it.extra || ""}`) })).filter((x) => x.r).sort((a, c) => c.r.s - a.r.s).map((x) => ({ ...x.it, _idx: x.r.idx }));
      }
      items = all;
      if (P.active >= items.length) P.active = Math.max(0, items.length - 1);
      body = items.length ? `<div role="listbox" id="pl" aria-label="Options">${items.map((it, i) => `<div class="opt" role="option" id="po-${i}" data-i="${i}" aria-selected="${i === P.active}"><span class="otag mono" aria-hidden="true">${esc(it.tag || "›")}</span><span class="otx"><span class="ol">${hl(it.label, it._idx)}${it.badge ? `<span class="badge">${esc(it.badge)}</span>` : ""}</span>${it.sub ? `<span class="os mono">${esc(it.sub)}</span>` : ""}</span>${it.right ? `<span class="oright mono">${esc(it.right)}</span>` : ""}</div>`).join("")}</div>`
        : `<div class="pempty mono">${esc(P.q.trim() ? "No match for “" + P.q.trim() + "”." : (step && step.empty) || "Nothing here.")}</div>`;
    }
  }
  P.items = items;
  $("#pbody").innerHTML = body;
  if (items.length) inp.setAttribute("aria-activedescendant", "po-" + P.active); else inp.removeAttribute("aria-activedescendant");
  $("#hints").textContent = isConf ? "↵ confirm · esc back" : isText ? "↵ continue · esc back" : "↑↓ move · ↵ select · esc back";
  if (changed) {
    if (isConf) pgo.focus({ preventScroll: true });
    else { inp.focus({ preventScroll: true }); if (isText) inp.select(); }
  }
}
function setActive(i, scroll) {
  if (!P.items.length) return;
  P.active = (i + P.items.length) % P.items.length;
  document.querySelectorAll("#pbody .opt").forEach((o) => o.setAttribute("aria-selected", String(+o.dataset.i === P.active)));
  inp.setAttribute("aria-activedescendant", "po-" + P.active);
  if (scroll) { const o = $("#po-" + P.active); if (o) o.scrollIntoView({ block: "nearest" }); }
}

inp.addEventListener("input", () => {
  const f = P.flow, step = curStep();
  if (step && step.kind === "text") { f.data[step.key] = inp.value; if (step.onInput) step.onInput(); if (P.err) { P.err = null; $("#perr").hidden = true; } return; }

inp.addEventListener("keydown", (e) => {

$("#pbody").addEventListener("mousedown", (e) => { if (e.target.closest(".opt")) e.preventDefault(); });
$("#pbody").addEventListener("click", (e) => { const o = e.target.closest(".opt"); if (o) pickItem(+o.dataset.i); });
$("#pbody").addEventListener("pointermove", (e) => { const o = e.target.closest(".opt"); if (o && e.pointerType === "mouse" && +o.dataset.i !== P.active) setActive(+o.dataset.i, false); });
$("#pcr").addEventListener("click", (e) => { const c = e.target.closest("[data-goto]"); if (c && P.flow && !P.busy) { P.flow.i = +c.dataset.goto; P.err = null; renderPal(); } });

$("#scrim").addEventListener("click", closePal);
pgo.addEventListener("click", submit);

    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

/* ---------- page events ---------- */
const narrow = () => matchMedia("(max-width:699px)").matches;
$("#list").addEventListener("click", (e) => {
  const a = e.target.closest("[data-act]");
  const op = a || e.target;
  if (a) {
    const act = a.dataset.act, id = a.dataset.id;
    if (act === "swap") openFlow("swap", { proxyId: id }, a);
    else if (act === "rename") openFlow("rename", { proxyId: id }, a);
    else if (act === "delete") openFlow("delProxy", { proxyId: id }, a);
    else if (act === "menu") openPal({ scope: { type: "proxy", id }, opener: a });
    else if (act === "gmenu") openPal({ scope: { type: "device", id }, opener: a });
    else if (act === "gadd") openFlow("newProxy", id ? { dev: id, devFixed: true } : { dev: null, devFixed: true }, a);
    else if (act === "newdev") openFlow("newDevice", {}, a);
    else if (act === "newproxy") openFlow("newProxy", {}, a);
    else if (act === "clear") { S.q = ""; S.filter = "all"; $("#q").value = ""; renderAll(); }
    else if (act === "reload") { S.loading = true; renderList(); load(); }
    return;
  }
  const r = e.target.closest("[data-row]");
  if (r && narrow()) { const btn = r.closest(".row").querySelector('[data-act="menu"]'); openPal({ scope: { type: "proxy", id: r.dataset.row }, opener: btn }); }
});
function openFlow(kind, preset, opener) { openPal({ opener }); start(kind, preset); }
$("#chips").addEventListener("click", (e) => { const c = e.target.closest("[data-f]"); if (c) { S.filter = c.dataset.f; renderAll(); } });
$("#q").addEventListener("input", (e) => { S.q = e.target.value; renderList(); });
$("#q").addEventListener("keydown", (e) => { if (e.key === "Escape" && S.q) { S.q = ""; e.target.value = ""; renderList(); } });
$("#qclr").addEventListener("click", () => { S.q = ""; $("#q").value = ""; renderList(); $("#q").focus(); });
$("#openpal").addEventListener("click", (e) => openPal({ opener: e.currentTarget }));
$("#cmdopen").addEventListener("click", (e) => openPal({ opener: e.currentTarget }));
$("#fabnew").addEventListener("click", (e) => openFlow("newProxy", {}, e.currentTarget));
$("#banner").addEventListener("click", (e) => {
  if (e.target.id === "bdis") { S.error = null; renderBanner(); }
  if (e.target.id === "bretry") { S.error = null; renderBanner(); load(); }
});
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); P.open ? closePal() : openPal(); return; }
  if (e.key === "/" && !P.open && !/INPUT|TEXTAREA/.test((document.activeElement || {}).tagName || "")) { e.preventDefault(); $("#q").focus(); }
});

/* ---------- simulator bar ---------- */
$("#simtg").addEventListener("click", (e) => {
  const open = e.currentTarget.getAttribute("aria-expanded") !== "true";
  e.currentTarget.setAttribute("aria-expanded", String(open)); $("#simpanel").hidden = !open;
});
M.onLog = (m) => { const l = $("#log"); l.textContent = m; l.title = m; };
M.onFailChange = (v) => { $("#sFail").setAttribute("aria-pressed", String(v)); };
$("#sToggle").addEventListener("click", () => { M.toggleSource(); load(true); });
$("#sFail").addEventListener("click", () => M.failNext(!M.isFailNext()));
$("#sReset").addEventListener("click", () => {
  M.reset(); M.failNext(false);
  S.toasts.forEach((t) => clearTimeout(t.timer)); S.toasts = []; renderToasts();
  S.pending.clear(); S.hist = {}; S.error = null; closePal();
  S.loading = true; renderAll(); load();
});
const effTheme = () => document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
const themeBtn = () => { $("#sTheme").textContent = effTheme() === "dark" ? "Light mode" : "Dark mode"; };
$("#sTheme").addEventListener("click", () => { document.documentElement.dataset.theme = effTheme() === "dark" ? "light" : "dark"; themeBtn(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", themeBtn);
themeBtn();

/* ---------- boot ---------- */
renderAll();
load();
{ const hh = location.hash.slice(1); if (hh === "cmd") openPal(); else if (hh === "new") openFlow("newProxy", {}); else if (hh === "swap") openFlow("swap", {}); }
setInterval(() => { if (document.hidden) return; M.tickEnergy(); load(true); }, 10000);
})();
</script>
</body>
</html>
