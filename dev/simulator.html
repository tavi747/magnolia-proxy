<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Magnolia Panel Simulator</title>
<style>
  :root {
    --primary-color: #03a9f4;
    --primary-text-color: #e1e1e1;
    --secondary-text-color: #9e9e9e;
    --primary-background-color: #111111;
    --card-background-color: #1c1c1c;
    --divider-color: #2c2c2c;
    --app-header-background-color: #1c1c1c;
  }
  body { margin: 0; background: #111; font-family: Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  magnolia-proxy-panel { flex: 1; min-height: 0; height: auto; }
  #sim-bar {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 8px 16px; background: #3a2a00; color: #ffd54f; font-size: 13px;
  }
  #sim-bar button { background: #5a4300; color: #ffd54f; border: 1px solid #806000; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  #sim-log { margin-left: auto; font-family: monospace; opacity: 0.85; }
</style>
</head>
<body>
<div id="sim-bar">
  <strong>SIMULATOR</strong> — mock backend, data lives in memory
  <button id="sim-toggle">Toggle a source state</button>
  <button id="sim-fail">Next call fails: off</button>
  <button id="sim-reset">Reset data</button>
  <span id="sim-log"></span>
</div>
<magnolia-proxy-panel></magnolia-proxy-panel>

<script src="redesign/mock-backend.js"></script>
<script>
// Mock backend lives in redesign/mock-backend.js (shared with the design concepts).
const M = window.MagnoliaMock;
const callApi = (m, p, b) => M.callApi(m, p, b);
const logEl = document.getElementById("sim-log");
const failBtn = document.getElementById("sim-fail");
M.onLog = (m) => (logEl.textContent = m);
M.onFailChange = (v) => (failBtn.textContent = `Next call fails: ${v ? "ON" : "off"}`);
failBtn.onclick = () => M.failNext(!M.isFailNext());
document.getElementById("sim-toggle").onclick = () => {
  M.toggleSource();
  logEl.textContent = "light.livingroom_desk_lamp toggled (panel picks it up on next 10s refresh)";
};
document.getElementById("sim-reset").onclick = () => location.reload();
</script>
<script type="module">
  await import("../custom_components/magnolia_proxy/frontend/magnolia-proxy-panel.js?t=" + Date.now());
  document.querySelector("magnolia-proxy-panel").hass = { callApi };
</script>
</body>
</html>
