name: Release

# Run by hand to publish a GitHub release for an existing vX.Y.Z tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v2.1.5"
        required: true
      title:
        description: "Release title (defaults to the tag)"
        required: false
      notes:
        description: "Release notes (empty: GitHub generates them from merged PRs)"
        required: false
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like vX.Y.Z, got '$TAG'"; exit 1
          fi
          if ! gh api "repos/$GH_REPO/git/ref/tags/$TAG" --silent 2>/dev/null; then
            echo "::error::Tag $TAG does not exist"; exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::A release for $TAG already exists"; exit 1
          fi
          args=(--verify-tag --title "${TITLE:-$TAG}")
          if [ -n "$NOTES" ]; then args+=(--notes "$NOTES"); else args+=(--generate-notes); fi
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}"
